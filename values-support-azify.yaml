# Custom values for support.azify.ir LibreDesk deployment
# Save this file as values-support-azify.yaml

ingress:
  enabled: true
  # Set the ingress className to match your ingress controller (traefik)
  className: "traefik"
  annotations: {}
  hosts:
    - host: support.azify.ir
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: support-azify-tls
      hosts:
        - support.azify.ir

# To use a custom admin/system password, create a secret:
# kubectl create secret generic libredesk-admin-password --from-literal=password="YourSecurePasswordHere" -n <namespace>
# Then uncomment the block below:
# systemUserPassword:
#   existingSecret:
#     enabled: true
#     name: "libredesk-admin-password"
#     key: "password"

config:
  app:
    # A unique 32-character encryption key is required.
    # We have pre-generated one for you. Keep this safe.
    encryptionKey: "5c8bde34f19b22a014d3b6f8a9e0f6c2"

    # --- Font Customization (Via Custom Static Directory) ---
    # Point the staticDir to a folder inside the container.
    staticDir: "/libredesk/custom-static"

# To override the widget font/CSS, we mount the custom CSS file using subPath.
# This prevents Kubernetes from creating the hidden "..data" symlink directory,
# which causes LibreDesk to crash with "is a directory" error.
extraVolumeMounts:
  - name: custom-static-assets
    mountPath: /libredesk/custom-static/custom.css  # Mount as a single file
    subPath: custom.css

extraVolumes:
  - name: custom-static-assets
    configMap:
      name: libredesk-custom-static
